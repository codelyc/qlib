# ═══════════════════════════════════════════════════════════════
# Qlib 模型回测配置 — 基线特征 + 新 PyTorch 模型
# ═══════════════════════════════════════════════════════════════
# 来源: RD-Agent/rdagent/scenarios/qlib/experiment/model_template/conf_baseline_factors_model.yaml
# 用途: Alpha20/158 基础特征 + LLM 生成的 PyTorch 模型（无 SOTA 因子）
#
# Jinja2 模板变量从 os.environ 读取（source .env 后自动可用）
# 优先级: export 临时覆盖 > .env 值 > default() 兜底

qlib_init:
    provider_uri: {{ QLIB_PROVIDER_URI | default("/qlib_data", true) }}
    region: cn

market: &market {{ market | default("csi300", true) }}
benchmark: &benchmark {{ benchmark | default("SH000300", true) }}

data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2020-01-01", true) }}
    end_time: {{ test_end | default("null", true) }}
    instruments: *market
    data_loader:
        class: NestedDataLoader
        kwargs:
            dataloader_l:
                - class: qlib.contrib.data.loader.Alpha158DL
                  kwargs:
                    config:
                        label:
                            - ["Ref($close, -2)/Ref($close, -1) - 1"]
                            - ["LABEL0"]
                        feature:
                            - {{ feature_expressions }}
                            - {{ feature_names }}

    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: {{ fit_start_time | default(train_start | default("2020-01-01", true), true) }}
              fit_end_time: {{ fit_end_time | default(train_end | default("2022-12-31", true), true) }}
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: {{ topk | default(50, true) }}
            n_drop: {{ n_drop | default(5, true) }}
    backtest:
        start_time: {{ test_start | default("2025-01-01", true) }}
        end_time: {{ test_end | default("null", true) }}
        account: {{ account | default(100000000, true) }}
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: {{ open_cost | default(0.0005, true) }}
            close_cost: {{ close_cost | default(0.0015, true) }}
            min_cost: 5

task:
    model:
        class: GeneralPTNN
        module_path: qlib.contrib.model.pytorch_general_nn
        kwargs:
            n_epochs: {{ n_epochs | default(100, true) }}
            lr: {{ lr | default(0.0002, true) }}
            early_stop: {{ early_stop | default(10, true) }}
            batch_size: {{ batch_size | default(256, true) }}
            weight_decay: {{ weight_decay | default(0.0001, true) }}
            metric: loss
            loss: mse
            n_jobs: 20
            GPU: 0
            pt_model_uri: "model.model_cls"
            pt_model_kwargs: {
                "num_features": {{ num_features | default(20, true) }}{% if num_timesteps %}, "num_timesteps": {{ num_timesteps }}{% endif %}
            }
    dataset:
        class: {{ dataset_cls | default("DatasetH", true) }}
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2020-01-01", true) }}, {{ train_end | default("2022-12-31", true) }}]
                valid: [{{ valid_start | default("2023-01-01", true) }}, {{ valid_end | default("2024-12-31", true) }}]
                test: [{{ test_start | default("2025-01-01", true) }}, {{ test_end | default("null", true) }}]
            {% if step_len %}step_len: {{ step_len }}{% endif %}
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
